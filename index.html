<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEF3E2">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="打开即玩的皇后推理小游戏。每行、每列、每个色块各放一个皇后，且皇后之间不能相邻。支持 4–16 自定义棋盘，每盘唯一解。">
<title>皇后 Queens · 打开即玩</title>
<!-- 图标内联成 data URI，不额外发请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FEF3E2'/%3E%3Cpath d='M16 5l3 5 4.6-3-1.3 7H9.7L8.4 7l4.6 3 3-5z' fill='%233A3335'/%3E%3Cpath d='M9.5 15h13l2.2 8.5H7.3L9.5 15z' fill='%233A3335'/%3E%3Crect x='7' y='24' width='18' height='3' rx='1.5' fill='%233A3335'/%3E%3C/svg%3E">

<!-- 样式只有一个入口：顺序（以及「加一个面板要加哪一行」）都在 src/styles/all.css 里 -->
<link rel="stylesheet" href="src/styles/all.css">
</head>

<body>

<!-- 骨架：顶栏 / 舞台（提示行 + 信息条 + 棋盘 + 工具栏）。
     浮层不写在这里——每个面板的 markup 跟着自己的模块走，由 main.js 挂到 #sheets。 -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-cn">皇后</span>
      <span class="brand-en">QUEENS</span>
    </div>

    <div class="actions">
      <button class="icon-btn" id="btnLook" type="button" aria-label="外观" aria-haspopup="dialog" aria-expanded="false" title="外观">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2C7 3.2 3 7.2 3 12.2s4 9 9 9c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c2.8 0 5-2.2 5-5 0-4.5-4-8-9-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="7.9" cy="9.7" r="1.2" fill="currentColor"></circle>
          <circle cx="11.6" cy="7.4" r="1.2" fill="currentColor"></circle>
          <circle cx="15.6" cy="9.4" r="1.2" fill="currentColor"></circle>
        </svg>
      </button>
      <button class="icon-btn" id="btnNew" type="button" aria-label="新一局" aria-haspopup="dialog" aria-expanded="false" title="新一局">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.6-5.9"></path>
          <path d="M20 4v5h-5"></path>
        </svg>
      </button>
      <button class="icon-btn" id="btnRecords" type="button" aria-label="战绩与排行榜" aria-haspopup="dialog" aria-expanded="false" title="战绩与排行榜">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3.5h8V9a4 4 0 0 1-8 0V3.5z"></path>
          <path d="M8 5.2H5.2v1.2A3.4 3.4 0 0 0 8.6 9.8"></path>
          <path d="M16 5.2h2.8v1.2a3.4 3.4 0 0 1-3.4 3.4"></path>
          <path d="M12 13v3.2"></path>
          <path d="M8.6 20.5h6.8"></path>
          <path d="M10 16.2h4v4.3h-4z"></path>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="设置" aria-haspopup="dialog" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 局内信息条：棋盘 / 用时 / 步数 / 皇后 / 难度走同一条、同一个按钮、同一个信息页。
       它和提示行装在一起（.stage-head），整块贴在棋盘上方。 -->
  <main class="stage" id="stage">
    <div class="stage-head" id="stageHead">
      <div class="hint-row" id="hintRow">
        <p class="hint" id="hint">轻点标 ×，按住可整行整列连涂</p>
        <!-- 棋盘上只剩皇后没标时，这一行整行让给它：点一下把剩下的皇后挨个落上去 -->
        <button class="finish-nudge" id="btnFinish" type="button" hidden>
          <svg class="fn-q" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.4 7.6l4.4 3L12 4.2l4.2 6.4 4.4-3-1.5 9.2H4.9L3.4 7.6z"></path>
            <path d="M5.6 20.2h12.8"></path>
          </svg>
          <span class="fn-text" id="finishText">只差 0 只皇后</span>
          <span class="fn-go">补齐</span>
        </button>
      </div>

      <div class="hud-row">
        <button class="hud" id="btnHud" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="本局信息">
          <span class="hud-seg" id="hudSize">8×8</span>
          <span class="hud-seg hud-time" id="timePill" aria-live="off">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
            <span id="timeText">00:00</span>
          </span>
          <!-- 步数 = 这一局一共落了几次笔（不封顶、撤销不退、刷新后还在）。
               图标是一段台阶：读的是「走到第几级」，不是「还能退几步」；
               开了步数限制时尾缀变成 /60 这样的上限。 -->
          <span class="hud-seg hud-step is-zero" id="stepPill" title="这一局走了几步">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.6 19.4h5.2v-5.2h5.2V8.9h5.4"></path>
            </svg>
            <span id="stepCount">0</span><span class="step-unit" id="stepUnit">步</span>
          </span>
          <span class="hud-seg hud-queen" id="queenPill"><svg class="hud-q" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 7.6l4.4 3L12 4.2l4.2 6.4 4.4-3-1.5 9.2H4.9L3.4 7.6z"></path><path d="M5.6 20.2h12.8"></path></svg> <span id="queenCount">0/8</span></span>
          <span class="hud-seg hud-diff" id="diffSeg" hidden>
            <i class="hud-dot" aria-hidden="true"></i><b id="diffLevel">中等</b><span id="diffScore">5.2</span>
          </span>
        </button>
      </div>

      <!-- 挑战「标错惩罚」的命数：只有这一局真的带惩罚时才露出来（ui/lives.js 管开关）。
           红心与血条两套画法都在这一条里，显示哪套看 <html data-life>（外观面板换）。
           放在信息条下面而不是挤进去：信息条在 320px 上已经排满了。
           id 叫 livesRow 而不是 lifeRow：后者是外观面板里那一排展位。 -->
      <div class="life-row" id="livesRow" hidden>
        <div class="lives" id="lives" role="img" aria-label="还剩 3 条命">
          <span class="life-hearts" id="lifeHearts"></span>
          <span class="life-bar">
            <span class="life-track"><span class="life-fill"></span>
              <span class="life-ticks" id="lifeTicks" aria-hidden="true"></span>
            </span>
          </span>
        </div>
      </div>
    </div>

    <div class="coach" id="coach" role="group" aria-label="提示引导" tabindex="-1" hidden>
      <div class="coach-top">
        <span class="coach-tier" id="coachTier">L1</span>
        <p class="coach-text" id="coachText"></p>
      </div>
      <div class="coach-ctl">
        <button class="cbtn" id="coachPrev" type="button">上一步</button>
        <span class="coach-dots" id="coachDots"></span>
        <button class="cbtn cbtn-go" id="coachNext" type="button">下一步</button>
        <button class="cbtn cbtn-x" id="coachClose" type="button">结束</button>
      </div>
    </div>

    <div class="board" id="board">
      <!-- 色块图案的 <defs>：外观插件提供的图形，每套图案每种颜色一枚 symbol，
           格子里的 .sk > use 指向它（见 game/skin.js）。0×0，不占地方。 -->
      <svg class="skin-defs" id="skinDefs" aria-hidden="true" focusable="false"></svg>
      <div class="grid" id="grid" role="grid" aria-label="皇后棋盘"></div>
      <svg class="tr" id="tr" aria-hidden="true"></svg>
      <svg class="rb" id="rb" aria-hidden="true"></svg>
      <svg class="rl" id="rl" aria-hidden="true">
        <g id="rlBad"></g>
        <g id="rlPeek"></g>
      </svg>
      <svg class="links" id="links" aria-hidden="true"></svg>
      <svg class="gl" id="gl" aria-hidden="true"></svg>
      <div class="gl-tags" id="glTags" aria-hidden="true"></div>
    </div>

    <div class="regions" id="regions" aria-hidden="true"></div>

    <!-- 工具栏：撤销 / 重做 / 记录点 / 提示 / 清空。
         撤销与重做是一对（Z / Shift+Z）：撤销退一步、重做把那一步再走回来，
         两边都只动棋盘、不涨步数，刷新之后两边一起空（撤销栈不落盘）。
         记录点是「记下这一刻、回头再来」的锚点（见 app/snap.js）：
         空着时写「记录」，记下了整颗翻成墨底、写「还原」。
         右上角那枚「?」只说三句话——长按清空这件事没法写在按钮上。 -->
    <div class="toolbar" id="toolbar">
      <button class="btn" id="btnUndo" type="button">撤销</button>
      <button class="btn" id="btnRedo" type="button">重做</button>
      <div class="snap-wrap">
        <button class="btn btn-snap" id="btnSnap" type="button" aria-pressed="false" title="记下这一刻（S）">
          <svg class="snap-ico" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 3.6h11v16.9l-5.5-3.9-5.5 3.9z" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linejoin="round"></path>
          </svg>
          <span class="snap-lb" id="snapLabel">记录</span>
        </button>
        <button class="snap-help" id="snapHelp" type="button" aria-label="记录点怎么用" title="记录点怎么用">?</button>
      </div>
      <button class="btn btn-hint" id="btnHint" type="button">提示</button>
      <button class="btn" id="btnClear" type="button">清空</button>
    </div>
  </main>
</div>

<div class="veil" id="veil" hidden>
  <div class="veil-card" role="status" aria-live="polite">
    <p class="veil-title" id="veilTitle">正在生成谜题</p>
    <div class="veil-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- 浮层挂载点：设置 / 本局信息 / 战绩 / 外观 / 结果层 / 「没抽到够格的盘」
     的 markup 由各自的模块带进来（src/js/ui/panels/），按注册顺序追加到这里。 -->
<div id="sheets"></div>

<div class="fx" id="fx" aria-hidden="true"></div>
<p class="sr-only" id="srStatus" role="status" aria-live="polite" aria-atomic="true"></p>

<noscript>
  <p style="padding:24px;text-align:center;font-weight:700">这个游戏需要开启 JavaScript。</p>
</noscript>

<!-- 引擎层：经典脚本（浏览器 / Node 双端通用），必须早于模块入口 -->
<script src="src/js/engine/engine.js"></script>
<script src="src/js/engine/difficulty.js"></script>
<script src="src/js/engine/hint.js"></script>

<!-- file:// 直接双击打开时浏览器会拦掉模块脚本，这里给一句人话提示 -->
<script>
  if (window.location.protocol === 'file:') {
    window.addEventListener('DOMContentLoaded', function () {
      var h = document.getElementById('hint');
      if (h) {
        h.textContent = '请双击「启动局域网游戏.bat」打开：file:// 下浏览器不允许加载 ES 模块';
        h.classList.add('is-alert');
      }
    });
  }
</script>

<!-- 应用入口 -->
<script type="module" src="src/js/main.js"></script>
</body>
</html>
